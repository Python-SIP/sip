# This workflow will run the tests for all ABIs on all supported versions of
# Python on Linux, macOS and Windows when pushing to the develop branch.

name: sip tests

on:
  # We only test the develop branch as, with the workflow we use, changes pass
  # through develop before reaching main.
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We don't currently test on macOS because GitHub can supply enough
        # runners so the tests always fail.
        #os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
    - name: Install sip
      run: |
        python -m pip install .
    - name: Test ABI v12
      run: |
        pytest --sip-abi-version 12
    - name: Test ABI v13
      run: |
        pytest --sip-abi-version 13
    - name: Test ABI v14
      if: ${{ matrix.python-version >= 3.15 }}
      run: |
        pytest --sip-abi-version 14
